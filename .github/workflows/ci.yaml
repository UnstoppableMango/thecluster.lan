name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile
      - run: bun run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod

      - run: go test ./...

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - run: nix flake check --all-systems
      - run: nix build .#api .#web .#app

  helm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: charts/thecluster
    env:
      HELM_EXPERIMENTAL_OCI: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - run: helm lint .

      - name: Helm package
        run: helm package . --destination "$RUNNER_TEMP"

      - name: Helm login
        if: github.event_name == 'push'
        run: echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Helm push
        if: github.event_name == 'push'
        run: |
          chart="$(find "$RUNNER_TEMP" -maxdepth 1 -name 'chart-*.tgz' -print -quit)"
          helm push "$chart" "oci://ghcr.io/${REPOSITORY,,}"
        env:
          REPOSITORY: ${{ github.repository }}

  docker:
    runs-on: ubuntu-latest
    needs: [nix]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/dashboard
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image stream
        run: |
          nix build .#ctr
          ./result | docker load

      - name: Tag and push image
        if: github.event_name == 'push'
        run: |
          image_id="thecluster.lan/dashboard:latest"
          docker image inspect "$image_id" >/dev/null
          while IFS= read -r target; do
            [ -n "$target" ] || continue
            docker tag "$image_id" "$target"
            docker push "$target"
          done <<'EOF'
          ${{ steps.meta.outputs.tags }}
          EOF
